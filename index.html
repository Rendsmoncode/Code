<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPTCG Maison</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <h1>OPTCG <span>Maison</span></h1>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-tab="cards">Cartes</button>
      <button role="tab" data-tab="decks">Decks</button>
      <button role="tab" data-tab="play">Jouer</button>
    </nav>
  </header>
  <main>
    <section class="tab" id="tab-cards" role="tabpanel"></section>
    <section class="tab" id="tab-decks" role="tabpanel" hidden></section>
    <section class="tab" id="tab-play" role="tabpanel" hidden></section>
  </main>
</body>
</html>
