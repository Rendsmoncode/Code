<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPTCG Maison</title>
  <link rel="stylesheet" href="style.css?v=mvjyxp7i">
  <link rel="stylesheet" href="cards.css?v=mvjyxp7i">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- app.js est généré depuis js/ par : npm run build -->
  <script src="app.js?v=mvjyxp7i" defer></script>
</head>
<body>
  <header class="top">
    <h1>OPTCG <span>Maison</span></h1>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-tab="boosters">Boosters</button>
      <button role="tab" data-tab="collection">Collection</button>
      <button role="tab" data-tab="decks">Decks</button>
      <button role="tab" data-tab="play">Jouer</button>
      <button role="tab" data-tab="cards" class="admin-only" hidden>Cartes</button>
      <button role="tab" data-tab="admin" class="admin-only" hidden>Admin</button>
    </nav>
    <div class="who"></div>
  </header>
  <main>
    <section class="tab" id="tab-boosters" role="tabpanel"></section>
    <section class="tab" id="tab-collection" role="tabpanel" hidden></section>
    <section class="tab" id="tab-decks" role="tabpanel" hidden></section>
    <section class="tab" id="tab-play" role="tabpanel" hidden></section>
    <section class="tab" id="tab-cards" role="tabpanel" hidden></section>
    <section class="tab" id="tab-admin" role="tabpanel" hidden></section>
  </main>
</body>
</html>
